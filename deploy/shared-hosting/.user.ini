; Agents upload videos of up to 100 MB (MEDIA_MAX_VIDEO_MB). PHP-FPM and
; LiteSpeed read this file; if the System page still shows a lower upload
; limit, set the same values in DirectAdmin → PHP settings (or ask the host).
upload_max_filesize = 128M
post_max_size = 130M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
